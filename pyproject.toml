[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kedro-ml-framwork"
version = "0.1.0"
description = "Reusable ML components in a Kedro project"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "kedro>=0.19,<2.0",
    "kedro-datasets[pandas-csvdataset,pandas-parquetdataset,json,pickle]>=3.0,<9.0",
    "numpy>=1.24,<3.0",
    "pandas>=2.0,<4.0",
    "scikit-learn>=1.6,<2.0",
    "kedro-mlflow>=2.0,<3.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.kedro]
package_name = "kedro_ml_framework"
project_name = "kedro_ml_framework"
kedro_init_version = "0.19.0"
tools = ""
example_pipeline = "False"
source_dir = "src"
